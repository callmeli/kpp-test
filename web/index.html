    <script>/* 埋点（luckylab analytics）：先固定设备 ID 和首次渠道，真正的 SDK /lt/t.js 异步加载后接管排队的事件。见 worker/lt.js */
(function(w,d,K){var S=w.localStorage,g=function(k){try{return S.getItem('lt_'+k)}catch(e){return null}},s=function(k,v){try{S.setItem('lt_'+k,v)}catch(e){}};
if(!g('anon'))s('anon','a_'+Date.now().toString(36)+Math.random().toString(36).slice(2,10));
var q=new URLSearchParams(w.location.search),rh='';try{rh=d.referrer?new URL(d.referrer).hostname:''}catch(e){}
if(!g('utm')&&q.get('utm_source'))s('utm',q.get('utm_source').slice(0,64));if(!g('ref')&&q.get('ref'))s('ref',q.get('ref').slice(0,64));
if(!g('utm'))s('utm',rh&&rh!==w.location.hostname?'referral:'+rh:'direct');
var Q=[];w.lt={q:Q,init:function(o){Q.push(['init',o])},track:function(e,p){Q.push(['track',e,p])},identify:function(u){Q.push(['identify',u])},
ctx:function(){return{anon_id:g('anon'),utm_source:g('utm'),ref:g('ref')}}};w.lt.init({key:K});
if(/^https?:$/.test(w.location.protocol)){var t=d.createElement('script');t.async=1;t.src='/lt/t.js';d.head.appendChild(t)}})(window,document,'kpp');</script>
